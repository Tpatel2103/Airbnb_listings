<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Listings Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Airbnb Listings Explorer</h1>
        <p>Explore the first 50 Airbnb listings</p>

        <div class="favorite-bar">
            ❤️ Favorites: <span id="favoriteCount">0</span>
        </div>
    </header>

    <main>
        <div id="loading">Loading listings...</div>

        <div id="listings" class="listing-grid"></div>
    </main>

    <footer>
        <p>Created for CS5610 Web Development</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
